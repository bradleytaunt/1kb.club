image: netbsd/latest
packages:
- ruby
- rsync
secrets:
  - 4494165b-6f9a-4659-9277-110124654c4c
  - 50c6ddb9-c241-40e0-beb2-2d090b79f74d
environment:
  repo: 1kb-club
  dest: /var/www/1kb.club
  server: 199.180.249.182
  BUNDLE_PATH: vendor/bundle
  JEKYLL_ENV: production
submitter:
  git.sr.ht:
    enabled: true
    allow-refs:
      - refs/heads/deploy
tasks:
- ssh-setup: |
    ssh-keyscan -H -4 $server >> ~/.ssh/known_hosts
- deps: |
    export PATH="$(gem environment user_gemdir)/bin:$PATH"
    cd $repo
    bundle install
- build: |
    export PATH="$(gem environment user_gemdir)/bin:$PATH"
    cd $repo
    bundle exec jekyll build
- deploy: |
    cd $repo
    rsync -rltvz --delete _site/ ramhost:$dest/